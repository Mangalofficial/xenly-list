name: update-lists
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download lists
        run: |
          set -euo pipefail
          mkdir -p lists
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --max-time 240 \
            -A "xenly-mirror/1.0" \
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/multi.txt" \
            -o lists/hagezi-multi.txt
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --max-time 240 \
            -A "xenly-mirror/1.0" \
            "https://raw.githubusercontent.com/sjhgvr/oisd/main/domainswild2_big.txt" \
            -o lists/oisd-full.txt
          for f in lists/hagezi-multi.txt lists/oisd-full.txt; do
            n=$(grep -cve '^[[:space:]]*$' -e '^#' -e '^!' "$f" || true)
            echo "$f -> $n lines"
            test "$n" -ge 100000
          done

      - name: Write manifest
        run: |
          node -e '
          const fs=require("fs"),c=require("crypto");
          const m={generated:new Date().toISOString(),files:{}};
          for(const f of ["hagezi-multi.txt","oisd-full.txt"]){
            const b=fs.readFileSync("lists/"+f);
            const lines=b.toString("utf8").split(/\r?\n/).filter(l=>l&&!l.startsWith("#")&&!l.startsWith("!")).length;
            m.files[f]={sha256:c.createHash("sha256").update(b).digest("hex"),bytes:b.length,lines};
          }
          fs.writeFileSync("lists/manifest.json",JSON.stringify(m,null,2)+"\n");
          '

      - name: Save to repository
        run: |
          git config user.name  "xenly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lists
          if git diff --cached --quiet; then echo "no change today"; exit 0; fi
          git commit -m "lists $(date -u +%F)"
          git push
